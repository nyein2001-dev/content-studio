<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- A Bit Inside: the video uses exactly four font files, loaded by path.
     Nothing is ever resolved from a system font directory. -->
<fontconfig>
  <dir prefix="default">/mnt/c/Users/dell/AnimationContentStudio/ABitInside/abitinside/assets/fonts</dir>
  <cachedir prefix="default">/mnt/c/Users/dell/AnimationContentStudio/ABitInside/abitinside/.cache/fontconfig</cachedir>

  <alias binding="strong">
    <family>Poppins</family>
    <prefer><family>Poppins</family></prefer>
  </alias>
  <alias binding="strong">
    <family>JetBrains Mono</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>

  <!-- map cairo's synthetic weight/oblique requests onto the real files -->
  <match target="pattern">
    <test qual="any" name="family"><string>Poppins</string></test>
    <test name="weight" compare="eq"><const>bold</const></test>
    <edit name="file" mode="assign" binding="same"><string>/mnt/c/Users/dell/AnimationContentStudio/ABitInside/abitinside/assets/fonts/Poppins-Bold.ttf</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Poppins</string></test>
    <test name="weight" compare="eq"><const>medium</const></test>
    <edit name="file" mode="assign" binding="same"><string>/mnt/c/Users/dell/AnimationContentStudio/ABitInside/abitinside/assets/fonts/Poppins-SemiBold.ttf</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Poppins</string></test>
    <edit name="file" mode="assign" binding="same"><string>/mnt/c/Users/dell/AnimationContentStudio/ABitInside/abitinside/assets/fonts/Poppins-Bold.ttf</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>JetBrains Mono</string></test>
    <edit name="file" mode="assign" binding="same"><string>/mnt/c/Users/dell/AnimationContentStudio/ABitInside/abitinside/assets/fonts/JetBrainsMono.ttf</string></edit>
  </match>
</fontconfig>